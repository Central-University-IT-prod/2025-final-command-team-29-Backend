[package]
name = "bot"
version = "0.1.0"
edition = "2021"

[dependencies]
hypertext = "0.6.2"
log = "0.4.25"
pretty_env_logger = "0.5.0"
reqwest = "0.12.12"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
teloxide = { version = "0.13.0", features = ["macros", "ctrlc_handler"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros"] }
