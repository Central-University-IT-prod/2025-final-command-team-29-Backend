basePath: /api/v1
definitions:
  handlers.clientSignResponse:
    properties:
      id:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        type: string
      phone_number:
        type: string
      token:
        type: string
    required:
    - name
    - phone_number
    type: object
  handlers.partnerSignResponse:
    properties:
      description:
        maxLength: 500
        minLength: 3
        type: string
      id:
        type: string
      image_id:
        type: integer
      password:
        type: string
      phone_number:
        type: string
      title:
        maxLength: 50
        minLength: 3
        type: string
      token:
        type: string
    required:
    - description
    - image_id
    - phone_number
    - title
    type: object
  handlers.signInRequest:
    properties:
      password:
        type: string
      phone_number:
        type: string
    required:
    - password
    - phone_number
    type: object
  models.ActivationRequest:
    properties:
      client_id:
        type: string
      promo_id:
        type: string
    type: object
  models.Client:
    properties:
      id:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        type: string
      phone_number:
        type: string
    required:
    - name
    - phone_number
    type: object
  models.Condition:
    properties:
      buy:
        type: integer
      type:
        enum:
        - COMMON
        - UNIQUE
        - BUNDLE
        type: string
    type: object
  models.ErrorResponse:
    description: 'Структура ошибки, возвращаемая API в формате { "error": "message"
      }'
    properties:
      error:
        example: Сообщение об ошибке
        type: string
    type: object
  models.ModerationBody:
    properties:
      partner_id:
        type: string
      promo_id:
        type: string
      verdict:
        type: boolean
    type: object
  models.Partner:
    properties:
      description:
        maxLength: 500
        minLength: 3
        type: string
      id:
        type: string
      image_id:
        type: integer
      password:
        type: string
      phone_number:
        type: string
      title:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - description
    - image_id
    - phone_number
    - title
    type: object
  models.Promo:
    properties:
      condition:
        $ref: '#/definitions/models.Condition'
      condition_string:
        description: ✅ ИСПРАВЛЕНО ЗДЕСЬ!
        type: string
      description:
        type: string
      image_id:
        type: integer
      is_active:
        type: boolean
      is_approved:
        type: boolean
      partner_id:
        type: string
      promo_id:
        type: string
      time_limit_end:
        type: integer
      time_limit_start:
        type: integer
      title:
        type: string
      usage_limit:
        type: integer
    required:
    - condition
    - image_id
    type: object
  models.PromoCLientView:
    properties:
      buy:
        type: integer
      condition:
        $ref: '#/definitions/models.Condition'
      condition_string:
        description: ✅ ИСПРАВЛЕНО ЗДЕСЬ!
        type: string
      created_at:
        type: string
      current:
        type: integer
      description:
        type: string
      image_id:
        type: integer
      is_active:
        type: boolean
      is_approved:
        type: boolean
      overall:
        type: integer
      partner_id:
        type: string
      promo_id:
        type: string
      time_limit_end:
        type: integer
      time_limit_start:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      usage_limit:
        type: integer
    required:
    - condition
    - image_id
    type: object
  models.Stat:
    description: Структура, содержащая основные бизнес-метрики использования промо-кодов.
    properties:
      active_promos_count:
        description: |-
          Количество активных промо-акций, которые в данный момент доступны клиентам.
          Промо-акция считается активной, если у нее `is_active = true`.
        example: 5
        type: integer
      active_users_count:
        description: |-
          Количество уникальных пользователей, которые использовали промо-коды.
          Каждый клиент считается только один раз, независимо от количества активаций.
        example: 85
        type: integer
      buy_promos_count:
        description: |-
          Общее количество покупок, совершенных с использованием промо-кодов.
          Считается суммарное количество активаций промо, приведших к покупке.
        example: 120
        type: integer
      conversion_rate:
        description: |-
          Конверсия пользователей в использование промо-кодов (в процентах).
          Рассчитывается как `(ActiveUsers / TotalClients) * 100`.
        example: 17
        type: number
      daily_active_users_count:
        description: |-
          Количество уникальных пользователей, активировавших промо-коды за последние 24 часа.
          Показывает ежедневную вовлеченность клиентов в акции.
        example: 25
        type: integer
      daily_buy_promo_count:
        description: |-
          Количество покупок, совершенных с промо-кодами за последние 24 часа.
          Полезно для оценки текущей активности пользователей.
        example: 30
        type: integer
      limit_promos_count:
        description: |-
          Количество промо-акций, достигших лимита использования.
          Например, если промо-код имеет ограничение `usage_limit = 100`, то он больше не учитывается после достижения лимита.
        example: 10
        type: integer
      retention_30d:
        description: |-
          Количество клиентов, которые использовали промо-коды повторно в последние 30 дней.
          Этот показатель помогает измерить уровень удержания клиентов.
        example: 40
        type: integer
      top_users:
        description: |-
          Количество топ-клиентов, которые использовали промо-коды чаще всего.
          Этот показатель можно использовать для определения лояльных клиентов.
        example: 10
        type: integer
      total_users:
        description: |-
          Общее количество зарегистрированных клиентов у партнера.
          Полезно для оценки охвата бизнеса и анализа конверсии в использование промо-кодов.
        example: 500
        type: integer
    type: object
  models.StatPromo:
    properties:
      buy_promos_count:
        type: integer
      daily_buy_promo_count:
        type: integer
      daily_users_count:
        type: integer
      users_count:
        type: integer
    type: object
  utils.Err:
    properties:
      message:
        type: string
    type: object
